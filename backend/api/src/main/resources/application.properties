# Server
server.port=8080
spring.application.name=roomrental-api
spring.profiles.default=local

# Database - UTF-8 Encoding
spring.datasource.url=jdbc:mysql://localhost:3306/phongtro_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.orm.jdbc.bind=TRACE
server.tomcat.uri-encoding=UTF-8

# JWT
jwt.expiration=900000

# Frontend URL cho CORS
frontend.url=http://localhost:5173
app.cookie.secure=false

# Upload file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=80MB

#Backup configuration
backup.directory=backups
backup.enabled=true
backup.retention-count=7
backup.cron=0 0 2 * * *

# Post expiration configuration
post.expiration.cron=0 55 1 * * *
